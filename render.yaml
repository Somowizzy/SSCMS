services:
  - type: web
    name: sscms
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Neon Postgres connection string for DB snapshot persistence.
      # Value is set in the Render dashboard (Environment), never committed.
      - key: DATABASE_URL
        sync: false
